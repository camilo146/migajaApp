<div class="auth-container">
  <div class="auth-card card">
    <div class="auth-header">
      <h1>Bienvenido de nuevo</h1>
      <p>Inicia sesión para continuar</p>
    </div>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="username">
          <span class="material-icons">person</span>
          Usuario
        </label>
        <input 
          id="username"
          type="text" 
          class="form-control" 
          formControlName="username"
          placeholder="Ingresa tu usuario"
          [class.error]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
        >
        <span class="error-message" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          El usuario es requerido
        </span>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="password">
          <span class="material-icons">lock</span>
          Contraseña
        </label>
        <input 
          id="password"
          type="password" 
          class="form-control" 
          formControlName="password"
          placeholder="Ingresa tu contraseña"
          [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
        <span class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          La contraseña debe tener al menos 6 caracteres
        </span>
      </div>
      
      <div class="alert alert-error" *ngIf="error">
        <span class="material-icons">error</span>
        {{ error }}
      </div>
      
      <button 
        type="submit" 
        class="btn btn-primary btn-lg btn-block" 
        [disabled]="loading || loginForm.invalid"
      >
        <span *ngIf="!loading">Iniciar Sesión</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>
    
    <div class="auth-footer">
      <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
    </div>
  </div>
</div>
