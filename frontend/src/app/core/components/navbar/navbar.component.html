<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand">
      <a routerLink="/" class="brand-link">
        <span class="brand-icon">🔰</span>
        <span class="brand-text">MigajerosBucaramanga</span>
      </a>
    </div>

    <button class="mobile-menu-toggle" (click)="toggleMobileMenu()">
      <span class="hamburger"></span>
    </button>

    <div class="navbar-menu" [class.active]="mobileMenuOpen">
      <div class="navbar-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          Inicio
        </a>
        <a routerLink="/stories" routerLinkActive="active">
          Historias
        </a>
        <a routerLink="/tournaments" routerLinkActive="active">
          🏆 Torneos
        </a>
        
        <ng-container *ngIf="isLoggedIn">
          <a routerLink="/stories/new" routerLinkActive="active">
            Crear Historia
          </a>
          <a routerLink="/my-stories" routerLinkActive="active">
            Mis Historias
          </a>
          <a *ngIf="isAdmin" routerLink="/admin" routerLinkActive="active" class="admin-link">
            ⚙️ Admin
          </a>
        </ng-container>
      </div>

      <div class="navbar-actions">
        <ng-container *ngIf="!isLoggedIn">
          <a routerLink="/login" class="btn-login">Iniciar Sesión</a>
          <a routerLink="/register" class="btn-register">Registrarse</a>
        </ng-container>
        
        <ng-container *ngIf="isLoggedIn">
          <div class="user-menu">
            <span class="username">👤 {{ username }}</span>
            <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</nav>
