<div class="toast-container">
  <div *ngFor="let toast of notificationService.toasts()" 
       class="toast" 
       [ngClass]="toast.type"
       [@toastAnimation]>
    <div class="toast-content">
      <span class="icon" *ngIf="toast.type === 'success'">✅</span>
      <span class="icon" *ngIf="toast.type === 'error'">❌</span>
      <span class="icon" *ngIf="toast.type === 'info'">ℹ️</span>
      <span class="icon" *ngIf="toast.type === 'warning'">⚠️</span>
      <span class="message">{{ toast.message }}</span>
    </div>
    <button class="close-btn" (click)="notificationService.remove(toast.id)">×</button>
  </div>
</div>
