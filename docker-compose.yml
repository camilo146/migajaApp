version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: migaja-db
    environment:
      POSTGRES_DB: migajadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - migaja-net

  backend:
    build: ./backend
    container_name: migaja-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/migajadb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - migaja-net

  frontend:
    build: ./frontend
    container_name: migaja-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - migaja-net

volumes:
  postgres_data:

networks:
  migaja-net:
    driver: bridge